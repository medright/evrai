<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="400" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="40%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0a6e6e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <!-- Left node outer ring -->
  <circle cx="176" cy="256" r="72" fill="none" stroke="url(#tl)" stroke-width="18"/>
  <!-- Left node inner fill -->
  <circle cx="176" cy="256" r="32" fill="url(#tl)"/>
  <!-- Right node outer ring -->
  <circle cx="336" cy="256" r="72" fill="none" stroke="url(#tl)" stroke-width="18"/>
  <!-- Right node inner fill -->
  <circle cx="336" cy="256" r="32" fill="url(#tl)"/>
  <!-- Connecting bridge -->
  <rect x="238" y="244" width="36" height="24" rx="12" fill="url(#tl)"/>
</svg>
